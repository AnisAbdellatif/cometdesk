[workspace]
resolver = "3"
members = ["crates/cometdesk", "crates/cometdesk-media", "crates/cometdesk-cli", "apps/cometdesk-gui", "crates/cometdesk-view", "crates/cometdesk-clip", "apps/cometdesk-agent", "crates/cometdesk-mock"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Its CELT band mask shifts a u8 past its width; harmless when it wraps, a panic when checked.
[profile.dev.package.opus-decoder]
overflow-checks = false

# str0m with two hooks for FlexFEC-03: FEC packets are delivered as raw packets, and
# recovered media packets can be injected. See vendor/str0m/CometDesk.md.
[patch.crates-io]
str0m = { path = "vendor/str0m" }
