[workspace]
resolver = "3"
members = ["crates/glkvm", "crates/glkvm-media", "crates/glkvm-cli", "apps/glkvm-gui", "crates/glkvm-view", "crates/glkvm-clip", "apps/glkvm-agent"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Its CELT band mask shifts a u8 past its width; harmless when it wraps, a panic when checked.
[profile.dev.package.opus-decoder]
overflow-checks = false

# str0m with two hooks for FlexFEC-03: FEC packets are delivered as raw packets, and
# recovered media packets can be injected. See vendor/str0m/GLKVM.md.
[patch.crates-io]
str0m = { path = "vendor/str0m" }
