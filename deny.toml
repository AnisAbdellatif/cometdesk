# cargo-deny: run `cargo deny check` (CI does).
# The project is MIT OR Apache-2.0 and clean-room (PLAN.md §0): no GPL/AGPL/LGPL code may
# enter the dependency tree.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = [
    # egui's bundled fonts (Ubuntu, Hack, Noto Emoji): font licenses that allow bundling and
    # don't apply to our code.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "warn"
ignore = [
    # ttf-parser is unmaintained (not a vulnerability). It only enters through winit's
    # Wayland client-side decorations (sctk-adwaita), which the macOS build doesn't use.
    { id = "RUSTSEC-2026-0192", reason = "Linux/Wayland-only transitive dep of winit" },
    # zbus family flagged unmaintained (not vulnerable). Only keyring's Linux Secret Service
    # backend uses it; the macOS build stores passwords in the Keychain.
    { id = "RUSTSEC-2026-0370", reason = "Linux-only keyring backend (zbus)" },
    { id = "RUSTSEC-2026-0371", reason = "Linux-only keyring backend (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "Linux-only keyring backend (zbus)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# egui is pinned to a main-branch commit until a release supports wgpu 30 (egui 0.38).
allow-git = ["https://github.com/emilk/egui"]
