<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Add device</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0B0B09}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width:1280px;height:832px;box-sizing:border-box;background:#0B0B09;color:#F4F1E3;font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center">

  <!-- dimmed connect screen behind -->
  <div style="position:absolute;inset:0;opacity:0.35;display:flex;flex-direction:column">
    <div style="height:80px;background:#12120F;border-bottom:1px solid #3A392E"></div>
    <div style="padding:40px 56px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px">
      <div style="height:188px;background:#1A1A15;border:1px solid #3A392E;border-radius:12px"></div>
      <div style="height:188px;background:#1A1A15;border:1px solid #3A392E;border-radius:12px"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:#0B0B09;opacity:0.7"></div>

  <!-- dialog -->
  <div style="position:relative;width:560px;box-sizing:border-box;background:#12120F;border:1px solid #3A392E;border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:22px">
    <div>
      <div style="font-size:22px;font-weight:700">Add device</div>
      <div style="font-size:14px;color:#A8A48C;margin-top:6px">A new Comet answers at 192.168.200.1 over USB or its own Wi-Fi.</div>
    </div>

    <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#A8A48C">Name
      <input placeholder="Office Comet" value="Office Comet" style="height:44px;box-sizing:border-box;background:#0B0B09;border:1px solid #3A392E;border-radius:8px;padding:0 14px;color:#F4F1E3;font-size:15px">
    </label>
    <div style="display:flex;gap:16px">
      <label style="flex:1;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#A8A48C">Address
        <input placeholder="192.168.200.1 or host:port" value="192.168.200.1" style="height:44px;box-sizing:border-box;background:#0B0B09;border:1.5px solid #FFD21F;border-radius:8px;padding:0 14px;color:#F4F1E3;font-size:15px;font-family:'JetBrains Mono',monospace">
      </label>
      <label style="width:160px;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#A8A48C">User
        <input value="admin" style="height:44px;box-sizing:border-box;background:#0B0B09;border:1px solid #3A392E;border-radius:8px;padding:0 14px;color:#F4F1E3;font-size:15px">
      </label>
    </div>
    <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#A8A48C">Password
      <input type="password" value="••••••••" style="height:44px;box-sizing:border-box;background:#0B0B09;border:1px solid #3A392E;border-radius:8px;padding:0 14px;color:#F4F1E3;font-size:15px">
    </label>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:13px;font-weight:600;color:#A8A48C">Target runs <span style="font-weight:400">· sets shortcuts and paste behaviour</span></div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#0B0B09;border:1px solid #3A392E;border-radius:8px;padding:3px;gap:3px">
        <button style="height:38px;border:0;border-radius:6px;background:#3A392E;color:#F4F1E3;font-size:14px;font-weight:600;cursor:pointer">Linux</button>
        <button style="height:38px;border:0;border-radius:6px;background:transparent;color:#A8A48C;font-size:14px;font-weight:500;cursor:pointer">Windows</button>
        <button style="height:38px;border:0;border-radius:6px;background:transparent;color:#A8A48C;font-size:14px;font-weight:500;cursor:pointer">macOS</button>
        <button style="height:38px;border:0;border-radius:6px;background:transparent;color:#A8A48C;font-size:14px;font-weight:500;cursor:pointer">BIOS / other</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;font-size:14px">
      <span style="width:20px;height:20px;border-radius:5px;background:#FFD21F;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" sc-camel-view-box="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.5L10 3.5" fill="none" stroke="#0B0B09" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      Remember password in the keychain
    </div>

    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:4px;padding-top:22px;border-top:1px solid #3A392E">
      <button style="height:44px;width:120px;background:#24241C;color:#F4F1E3;border:1px solid #3A392E;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">Cancel</button>
      <button style="height:44px;width:180px;background:#FFD21F;color:#0B0B09;border:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer">Save and connect</button>
    </div>
  </div>
</div>
</x-dc>

</body></html>
