  <div style="position:absolute;left:50%;top:110px;margin-left:-300px;width:600px;box-sizing:border-box;background:#12120F;border:1px solid #3A392E;border-radius:14px;overflow:hidden">

      <div style="font-size:16px;color:#F4F1E3">pow<span style="display:inline-block;width:1.5px;height:18px;background:#FFD21F;vertical-align:middle"></span></div>
      <div style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;background:#24241C;border:1px solid #3A392E;border-radius:4px;padding:2px 6px;color:#A8A48C">esc</div>
    </div>
    <div style="padding:8px">
      <div style="padding:8px 12px 4px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#A8A48C">Power</div>

      <div style="height:42px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:14px"><span>Shut down</span><span style="color:#A8A48C;font-size:12px">asks first</span></div>

      <div style="padding:12px 12px 4px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#A8A48C">Viewer</div>
