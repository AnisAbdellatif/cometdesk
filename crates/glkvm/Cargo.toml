[package]
name = "glkvm"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "gzip", "query", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
