[package]
name = "cometdesk-cli"
version = "0.1.2"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
cometdesk = { version = "0.1.0", path = "../cometdesk" }
cometdesk-media = { version = "0.1.0", path = "../cometdesk-media" }
cometdesk-view = { version = "0.1.0", path = "../cometdesk-view" }
libc = "0.2.191"
pollster = "1.0.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"

[dev-dependencies]
bytes = "1.12.1"
cometdesk-mock = { version = "0.1.0", path = "../cometdesk-mock" }
