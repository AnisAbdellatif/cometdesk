[package]
name = "cometdesk-view"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cometdesk = { version = "0.1.0", path = "../cometdesk" }
cometdesk-media = { version = "0.1.0", path = "../cometdesk-media" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
objc2-metal = "0.3.2"

[dev-dependencies]
bytes = "1.12.1"
pollster = "1.0.1"
