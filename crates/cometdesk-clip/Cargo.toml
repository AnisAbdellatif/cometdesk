[package]
name = "cometdesk-clip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.4.3"
png = "0.18.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
# Not "std": in snow 0.10.0 it enables `ring/std` unconditionally, which pulls in ring (C code)
# and breaks cross-compiling the agent. The pure-Rust resolver needs no std feature.
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
thiserror = "2.0.21"
