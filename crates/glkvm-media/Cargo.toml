[package]
name = "glkvm-media"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
glkvm = { version = "0.1.0", path = "../glkvm" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
