[package]
name = "glkvm-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
glkvm-clip = { version = "0.1.0", path = "../../crates/glkvm-clip" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13.2"
