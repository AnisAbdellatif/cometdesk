[package]
name = "cometdesk-gui"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
egui = { git = "https://github.com/emilk/egui", rev = "fc9d66dda742d722eedaa8684d23f86369cf8e5f", version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { git = "https://github.com/emilk/egui", rev = "fc9d66dda742d722eedaa8684d23f86369cf8e5f", version = "0.37.0", default-features = false, features = ["macos-window-resize-jitter-fix"] }
egui-winit = { git = "https://github.com/emilk/egui", rev = "fc9d66dda742d722eedaa8684d23f86369cf8e5f", version = "0.37.0" }
futures-util = "0.3.34"
cometdesk = { version = "0.1.0", path = "../../crates/cometdesk" }
cometdesk-clip = { version = "0.1.0", path = "../../crates/cometdesk-clip" }
cometdesk-media = { version = "0.1.0", path = "../../crates/cometdesk-media" }
cometdesk-view = { version = "0.1.0", path = "../../crates/cometdesk-view" }
keyring = "4.2.0"
open = "5.4.5"
png = "0.18.1"
pollster = "1.0.1"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSData", "NSDictionary", "NSError", "NSGeometry"] }
objc2 = "0.6"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNObservation", "VNRecognizeTextRequest", "VNTypes", "VNGeometry", "objc2-core-foundation"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["LAContext", "block2"] }
block2 = { version = "0.6", default-features = false }
