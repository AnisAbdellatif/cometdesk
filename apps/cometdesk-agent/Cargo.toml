[package]
name = "cometdesk-agent"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
cometdesk-clip = { version = "0.1.0", path = "../../crates/cometdesk-clip" }
desktop-kit = { version = "0.1.0", git = "https://github.com/AnisAbdellatif/desktop-kit", tag = "v0.1.0" }
zeroize = { version = "1.9.1" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_Ime"] }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13.2"
