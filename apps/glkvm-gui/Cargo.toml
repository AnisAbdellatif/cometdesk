[package]
name = "glkvm-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
egui = { git = "https://github.com/emilk/egui", rev = "fc9d66dda742d722eedaa8684d23f86369cf8e5f", version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { git = "https://github.com/emilk/egui", rev = "fc9d66dda742d722eedaa8684d23f86369cf8e5f", version = "0.37.0", default-features = false, features = ["macos-window-resize-jitter-fix"] }
egui-winit = { git = "https://github.com/emilk/egui", rev = "fc9d66dda742d722eedaa8684d23f86369cf8e5f", version = "0.37.0" }
glkvm = { version = "0.1.0", path = "../../crates/glkvm" }
glkvm-media = { version = "0.1.0", path = "../../crates/glkvm-media" }
glkvm-view = { version = "0.1.0", path = "../../crates/glkvm-view" }
keyring = "4.2.0"
open = "5.4.5"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"
