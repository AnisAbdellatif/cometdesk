# No "auth_request off": the server-level kvmd login check applies to all locations.
location /glkvm-bridge/ws {
	rewrite ^/glkvm-bridge/ws$ /ws break;
	proxy_pass http://glkvm-bridge;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-websocket.conf;
}

location = /glkvm-bridge/status {
	rewrite ^ /status break;
	proxy_pass http://glkvm-bridge;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-nocache.conf;
}

location /glkvm-bridge/agents/ {
	rewrite ^/glkvm-bridge/agents/(.*)$ /agents/$1 break;
	proxy_pass http://glkvm-bridge;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-bigpost.conf;
}
